<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexBar Signal System</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 350px; margin: 0 auto; text-align: center; }
        .buy { color: #00e676; }
        .sell { color: #ff5252; }
        .neutral { color: #888; }
        .status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
        .on { background: #1b5e20; color: #81c784; }
    </style>
</head>
<body>
    <div class="card">
        <h2>BTC/USDT</h2>
        <div>
            <span id="binance" class="status">Binance OFF</span>
            <span id="delta" class="status">Delta OFF</span>
        </div>
        <hr style="border-color: #333; margin: 15px 0;">
        <p>SIGNAL</p>
        <h1 id="signal" class="neutral">LOADING...</h1>
        <h3>Confidence: <span id="confidence">0</span>%</h3>
        <p>Imbalance: <span id="imbalance">0.000</span></p>
    </div>

    <script>
        async function fetchSignal() {
            try {
                let res = await fetch('/api/signal');
                let data = await res.json();
                
                let sigElem = document.getElementById('signal');
                sigElem.innerText = data.signal;
                sigElem.className = data.signal.includes('BUY') ? 'buy' : (data.signal.includes('SELL') ? 'sell' : 'neutral');
                
                document.getElementById('confidence').innerText = data.confidence;
                document.getElementById('imbalance').innerText = data.imbalance;
                
                document.getElementById('binance').innerText = "Binance " + data.binance_status;
                document.getElementById('binance').className = "status " + (data.binance_status === 'ON' ? 'on' : '');
                
                document.getElementById('delta').innerText = "Delta " + data.delta_status;
                document.getElementById('delta').className = "status " + (data.delta_status === 'ON' ? 'on' : '');
            } catch(e) { console.error(e); }
        }
        setInterval(fetchSignal, 1000);
    </script>
</body>
</html>

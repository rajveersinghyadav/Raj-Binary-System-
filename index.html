<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBar Multi-Asset Fresh Merge System</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #181a20; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .asset-select { width: 100%; padding: 12px; background: #2b313a; color: #fff; border: 1px solid #363c4e; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 15px; outline: none; }
        
        .badges { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .badge.on { background: rgba(14, 203, 129, 0.2); color: #0ecb81; border: 1px solid #0ecb81; }
        .badge.off { background: rgba(246, 70, 93, 0.2); color: #f6465d; border: 1px solid #f6465d; }

        .price { font-size: 28px; font-weight: bold; text-align: center; margin: 5px 0 15px 0; }

        .timer-box { background: #222630; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 15px; }
        .timer-val { font-size: 22px; font-weight: bold; color: #f0b90b; }
        .phase-text { font-size: 12px; margin-top: 4px; font-weight: 600; }

        .signal-card { background: #2b313a; border-radius: 12px; padding: 20px; text-align: center; border: 2px solid transparent; transition: all 0.3s; }
        .signal-card.GREEN { border-color: #0ecb81; background: rgba(14, 203, 129, 0.15); }
        .signal-card.RED { border-color: #f6465d; background: rgba(246, 70, 93, 0.15); }
        
        .signal-type { font-size: 24px; font-weight: 800; margin: 8px 0; }
        .BUY { color: #0ecb81; }
        .SELL { color: #f6465d; }
        .WAITING { color: #848e9c; }

        .status-tag { font-size: 11px; padding: 4px 10px; border-radius: 4px; display: inline-block; font-weight: bold; text-transform: uppercase; }
        
        .bar-container { background: #363c4e; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; display: flex; }
        .buy-bar { background: #0ecb81; height: 100%; width: 50%; transition: width 0.2s; }
        .sell-bar { background: #f6465d; height: 100%; width: 50%; transition: width 0.2s; }

        .stats { display: flex; justify-content: space-between; font-size: 11px; color: #848e9c; }
        .stats b { font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <select id="asset-selector" class="asset-select" onchange="switchAssetWithReload()">
        <optgroup label="Crypto Assets (Binance + Delta)">
            <option value="BTCUSDT">Bitcoin (BTC/USDT)</option>
            <option value="ETHUSDT">Ethereum (ETH/USDT)</option>
            <option value="SOLUSDT">Solana (SOL/USDT)</option>
            <option value="CRYPTO_IDX">Crypto IDX</option>
        </optgroup>
        <optgroup label="Forex Pairs (Binance + Yahoo Interbank)">
            <option value="EURUSD">EUR / USD</option>
            <option value="AUDCAD">AUD / CAD</option>
            <option value="AUDCHF">AUD / CHF</option>
            <option value="AUDJPY">AUD / JPY</option>
            <option value="AUDUSD">AUD / USD</option>
        </optgroup>
    </select>

    <div class="badges">
        <span id="source1-status" class="badge off">Source 1 OFF</span>
        <span id="source2-status" class="badge off">Source 2 OFF</span>
    </div>

    <div id="price" class="price">0.00</div>

    <div class="timer-box">
        <div>Clock: <span id="timer" class="timer-val">00:59</span></div>
        <div id="phase-text" class="phase-text" style="color:#f0b90b;">System Initializing...</div>
    </div>

    <div id="signal-card" class="signal-card">
        <div id="status-tag" class="status-tag" style="background:#f0b90b; color:#000;">FRESH DATA CONNECTING</div>
        <div id="signal" class="signal-type WAITING">ANALYZING...</div>
        <div>Confidence: <b id="confidence" style="color:#fff;">50%</b></div>

        <div class="bar-container">
            <div id="buy-bar" class="buy-bar"></div>
            <div id="sell-bar" class="sell-bar"></div>
        </div>

        <div class="stats">
            <span>Buyer Vol: <b id="total-bids" style="color:#0ecb81">0</b></span>
            <span>Imbalance: <b id="imbalance-val" style="color:#fff">0.000</b></span>
            <span>Seller Vol: <b id="total-asks" style="color:#f6465d">0</b></span>
        </div>
    </div>
</div>

<script>
    // URL Parameter Parsing to Keep Asset Selected on Hard Refresh
    const urlParams = new URLSearchParams(window.location.search);
    let currentAsset = urlParams.get('asset') || 'BTCUSDT';
    
    document.getElementById('asset-selector').value = currentAsset;

    function switchAssetWithReload() {
        const selected = document.getElementById('asset-selector').value;
        // Hard Reload with New Asset URL Parameter
        window.location.href = window.location.pathname + '?asset=' + selected;
    }

    let wsSource1 = null, wsSource2 = null, yahooInterval = null;
    let bids1 = 0, asks1 = 0;
    let bids2 = 0, asks2 = 0;
    let tickBuy = 0, tickSell = 0;
    let lastPrice = 0;
    let lockedSignalData = null;

    // Asset Routing & Precision Registry
    const assetRegistry = {
        'BTCUSDT': { type: 'crypto', binanceSymbol: 'btcusdt', deltaSymbol: 'BTC_USDT', decimals: 2 },
        'ETHUSDT': { type: 'crypto', binanceSymbol: 'ethusdt', deltaSymbol: 'ETH_USDT', decimals: 2 },
        'SOLUSDT': { type: 'crypto', binanceSymbol: 'solusdt', deltaSymbol: 'SOL_USDT', decimals: 2 },
        'CRYPTO_IDX': { type: 'crypto', binanceSymbol: 'btcusdt', deltaSymbol: 'BTC_USDT', decimals: 2 },
        'EURUSD': { type: 'forex', binanceSymbol: 'eurusdt', yahooSymbol: 'EURUSD=X', decimals: 5 },
        'AUDCAD': { type: 'forex', binanceSymbol: 'audusdt', yahooSymbol: 'AUDCAD=X', decimals: 5 },
        'AUDCHF': { type: 'forex', binanceSymbol: 'audusdt', yahooSymbol: 'AUDCHF=X', decimals: 5 },
        'AUDJPY': { type: 'forex', binanceSymbol: 'audusdt', yahooSymbol: 'AUDJPY=X', decimals: 3 },
        'AUDUSD': { type: 'forex', binanceSymbol: 'audusdt', yahooSymbol: 'AUDUSD=X', decimals: 5 }
    };

    const config = assetRegistry[currentAsset] || assetRegistry['BTCUSDT'];

    function startFreshStreams() {
        document.getElementById('price').innerText = "CONNECTING...";

        // STREAM 1: Binance WebSockets (Depth + Trades)
        wsSource1 = new WebSocket(`wss://stream.binance.com:9443/ws/${config.binanceSymbol}@depth10@100ms/${config.binanceSymbol}@trade`);

        wsSource1.onopen = () => {
            const badge = document.getElementById('source1-status');
            badge.className = 'badge on';
            badge.innerText = 'Binance ON';
        };

        wsSource1.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.p) {
                let p = parseFloat(data.p);
                if (currentAsset === 'CRYPTO_IDX') {
                    p = (p * 0.125) + 250; // Dynamic Composite Formula
                }
                if (config.type === 'crypto') {
                    document.getElementById('price').innerText = p.toFixed(config.decimals);
                }
                
                if (data.m) tickSell += parseFloat(data.q);
                else tickBuy += parseFloat(data.q);
            }

            if (data.bids && data.asks) {
                bids1 = data.bids.reduce((sum, item) => sum + (parseFloat(item[0]) * parseFloat(item[1])), 0);
                asks1 = data.asks.reduce((sum, item) => sum + (parseFloat(item[0]) * parseFloat(item[1])), 0);
            }
        };

        // STREAM 2: Conditional Setup (Crypto -> Delta | Forex -> Yahoo Interbank)
        if (config.type === 'crypto') {
            document.getElementById('source2-status').innerText = 'Delta OFF';
            wsSource2 = new WebSocket('wss://socket.delta.exchange');

            wsSource2.onopen = () => {
                document.getElementById('source2-status').className = 'badge on';
                document.getElementById('source2-status').innerText = 'Delta ON';
                wsSource2.send(JSON.stringify({
                    "type": "subscribe",
                    "payload": { "channels": [{ "name": "l2orderbook", "symbols": [config.deltaSymbol] }] }
                }));
            };

            wsSource2.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'l2orderbook') {
                    if (data.bids) bids2 = data.bids.reduce((sum, item) => sum + (parseFloat(item.limit_price || 0) * parseFloat(item.size || 0)), 0);
                    if (data.asks) asks2 = data.asks.reduce((sum, item) => sum + (parseFloat(item.limit_price || 0) * parseFloat(item.size || 0)), 0);
                }
            };
        } else {
            // Forex Yahoo Live Interbank Feed
            document.getElementById('source2-status').innerText = 'Yahoo FX OFF';
            fetchYahooFX();
            yahooInterval = setInterval(fetchYahooFX, 2000);
        }
    }

    async function fetchYahooFX() {
        try {
            const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${config.yahooSymbol}?interval=1m`);
            const json = await res.json();
            if (json.chart && json.chart.result && json.chart.result[0]) {
                const meta = json.chart.result[0].meta;
                const price = meta.regularMarketPrice;

                document.getElementById('source2-status').className = 'badge on';
                document.getElementById('source2-status').innerText = 'Yahoo FX ON';

                document.getElementById('price').innerText = price.toFixed(config.decimals);

                if (lastPrice !== 0) {
                    const diff = price - lastPrice;
                    if (diff > 0) bids2 += Math.abs(diff) * 800000;
                    else if (diff < 0) asks2 += Math.abs(diff) * 800000;
                }
                lastPrice = price;
            }
        } catch (e) {
            console.log("Yahoo FX Feed Syncing...");
        }
    }

    // Binary Timer Engine (30s Bet Pause / 15s Confirmation / 15s Bet Entry)
    setInterval(() => {
        const now = new Date();
        const seconds = now.getSeconds();
        const remainingSeconds = 59 - seconds;

        document.getElementById('timer').innerText = `00:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;

        // PHASE 1: 30s to 00s (Background Accumulation)
        if (remainingSeconds < 30) {
            lockedSignalData = null;
            document.getElementById('phase-text').innerText = 'Bet Paused (30s-00s). Accumulating Fresh Orderbook...';
            document.getElementById('phase-text').style.color = '#f0b90b';
            
            document.getElementById('status-tag').innerText = 'ACCUMULATING LIVE DATA';
            document.getElementById('status-tag').style.background = '#363c4e';
            document.getElementById('status-tag').style.color = '#fff';

            const liveData = calculateMergedData();
            renderUI(liveData, "ANALYZING...");
        } 
        // PHASE 2: 59s to 45s (First 15s Confirmation)
        else if (remainingSeconds >= 45) {
            document.getElementById('phase-text').innerText = 'New Candle Open! Confirming First 15s Imbalance...';
            document.getElementById('phase-text').style.color = '#f0b90b';
            
            document.getElementById('status-tag').innerText = 'CONFIRMING IMBALANCE (15s)';
            document.getElementById('status-tag').style.background = '#f0b90b';
            document.getElementById('status-tag').style.color = '#000';

            const liveData = calculateMergedData();
            renderUI(liveData, "CONFIRMING...");
        } 
        // PHASE 3: 44s to 30s (Signal Locked / Bet Entry)
        else {
            document.getElementById('phase-text').innerText = 'SIGNAL LOCKED! PLACE BET NOW ON BROKER';
            document.getElementById('phase-text').style.color = '#0ecb81';
            
            document.getElementById('status-tag').innerText = 'FINAL SIGNAL (BET NOW)';
            document.getElementById('status-tag').style.background = '#0ecb81';
            document.getElementById('status-tag').style.color = '#fff';

            if (!lockedSignalData) {
                lockedSignalData = calculateMergedData();
            }
            renderUI(lockedSignalData, lockedSignalData.signalText);
        }

        if (seconds === 0) {
            tickBuy = 0; tickSell = 0;
            bids2 = 0; asks2 = 0;
        }
    }, 1000);

    function calculateMergedData() {
        const totalBids = bids1 + bids2 + (tickBuy * 400);
        const totalAsks = asks1 + asks2 + (tickSell * 400);
        const totalVolume = totalBids + totalAsks;

        if (totalVolume === 0) {
            return { signalText: "NEUTRAL", sigClass: "WAITING", cardClass: "", confidence: 50, imbalance: 0, totalBids: 0, totalAsks: 0 };
        }

        const imbalance = (totalBids - totalAsks) / totalVolume;
        const confidence = Math.min(Math.round(52 + (Math.abs(imbalance) * 48)), 99);

        let signalText = "NEUTRAL";
        let cardClass = "";
        let sigClass = "WAITING";

        if (imbalance > 0.04) {
            signalText = "NEXT CANDLE: GREEN (BUY)";
            sigClass = "BUY";
            cardClass = "GREEN";
        } else if (imbalance < -0.04) {
            signalText = "NEXT CANDLE: RED (SELL)";
            sigClass = "SELL";
            cardClass = "RED";
        }

        return { signalText, sigClass, cardClass, confidence, imbalance, totalBids, totalAsks };
    }

    function renderUI(data, overrideText) {
        const sigCard = document.getElementById('signal-card');
        sigCard.className = 'signal-card ' + data.cardClass;

        const sigElem = document.getElementById('signal');
        sigElem.innerText = overrideText === "CONFIRMING..." || overrideText === "ANALYZING..." ? overrideText : data.signalText;
        sigElem.className = 'signal-type ' + data.sigClass;

        document.getElementById('confidence').innerText = data.confidence + '%';
        document.getElementById('imbalance-val').innerText = data.imbalance.toFixed(3);

        let bidsFormatted = data.totalBids > 1000000 ? (data.totalBids/1000000).toFixed(1) + 'M' : Math.round(data.totalBids / 1000) + 'k';
        let asksFormatted = data.totalAsks > 1000000 ? (data.totalAsks/1000000).toFixed(1) + 'M' : Math.round(data.totalAsks / 1000) + 'k';

        document.getElementById('total-bids').innerText = bidsFormatted;
        document.getElementById('total-asks').innerText = asksFormatted;

        const buyPct = Math.max(10, Math.min(90, ((data.imbalance + 1) / 2) * 100));
        document.getElementById('buy-bar').style.width = buyPct + '%';
        document.getElementById('sell-bar').style.width = (100 - buyPct) + '%';
    }

    startFreshStreams();
</script>
</body>
</html>

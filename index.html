<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBar Real Modular Precision System</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #181a20; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .asset-select { width: 100%; padding: 12px; background: #2b313a; color: #fff; border: 1px solid #363c4e; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 12px; outline: none; }
        
        .badges { display: flex; justify-content: center; margin-bottom: 10px; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .badge.on { background: rgba(14, 203, 129, 0.2); color: #0ecb81; border: 1px solid #0ecb81; }
        .badge.off { background: rgba(246, 70, 93, 0.2); color: #f6465d; border: 1px solid #f6465d; }

        .price { font-size: 28px; font-weight: bold; text-align: center; margin: 5px 0 12px 0; color: #f0b90b; }

        .timer-box { background: #222630; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 12px; }
        .timer-val { font-size: 22px; font-weight: bold; color: #f0b90b; }
        .phase-text { font-size: 11px; margin-top: 4px; font-weight: 600; }

        .signal-card { background: #2b313a; border-radius: 12px; padding: 15px; text-align: center; border: 2px solid transparent; transition: all 0.3s; margin-bottom: 15px; }
        .signal-card.GREEN { border-color: #0ecb81; background: rgba(14, 203, 129, 0.15); }
        .signal-card.RED { border-color: #f6465d; background: rgba(246, 70, 93, 0.15); }
        
        .signal-type { font-size: 20px; font-weight: 800; margin: 6px 0; }
        .BUY { color: #0ecb81; }
        .SELL { color: #f6465d; }
        .WAITING { color: #848e9c; }

        .status-tag { font-size: 10px; padding: 3px 8px; border-radius: 4px; display: inline-block; font-weight: bold; text-transform: uppercase; }
        
        .bar-container { background: #363c4e; height: 8px; border-radius: 4px; margin: 12px 0; overflow: hidden; display: flex; }
        .buy-bar { background: #0ecb81; height: 100%; width: 50%; transition: width 0.2s; }
        .sell-bar { background: #f6465d; height: 100%; width: 50%; transition: width 0.2s; }

        .stats { display: flex; justify-content: space-between; font-size: 11px; color: #848e9c; }

        /* LIVE ORDERBOOK STREAM TABLE */
        .book-container { background: #121418; border-radius: 8px; border: 1px solid #2b313a; padding: 10px; }
        .book-title { font-size: 11px; font-weight: bold; color: #848e9c; margin-bottom: 8px; text-align: center; text-transform: uppercase; }
        .book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 10px; font-family: monospace; }
        .book-col-header { display: flex; justify-content: space-between; color: #5e6673; border-bottom: 1px solid #2b313a; padding-bottom: 4px; font-weight: bold; }
        .book-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .bid-p { color: #0ecb81; font-weight: bold; }
        .ask-p { color: #f6465d; font-weight: bold; }
        .vol { color: #eaecef; }
    </style>
</head>
<body>

<div class="container">
    <select id="asset-selector" class="asset-select" onchange="switchAssetWithReload()">
        <optgroup label="Crypto Assets">
            <option value="BTCUSDT">Bitcoin (BTC/USDT)</option>
            <option value="ETHUSDT">Ethereum (ETH/USDT)</option>
            <option value="SOLUSDT">Solana (SOL/USDT)</option>
            <option value="CRYPTO_IDX">Crypto IDX</option>
        </optgroup>
        <optgroup label="Forex Pairs">
            <option value="EURUSD">EUR / USD</option>
            <option value="AUDCAD">AUD / CAD</option>
            <option value="AUDCHF">AUD / CHF</option>
            <option value="AUDJPY">AUD / JPY</option>
            <option value="AUDUSD">AUD / USD</option>
        </optgroup>
    </select>

    <div class="badges">
        <span id="stream-status" class="badge off">CONNECTING EXCHANGE STREAM...</span>
    </div>

    <div id="price" class="price">CONNECTING...</div>

    <div class="timer-box">
        <div>Clock: <span id="timer" class="timer-val">00:59</span></div>
        <div id="phase-text" class="phase-text" style="color:#848e9c;">Connecting Data Import Engine...</div>
    </div>

    <!-- CALCULATION & SIGNAL SECTION -->
    <div id="signal-card" class="signal-card">
        <div id="status-tag" class="status-tag" style="background:#363c4e; color:#fff;">IMPORTING DATA</div>
        <div id="signal" class="signal-type WAITING">WAITING FOR STREAM...</div>
        <div>Confidence: <b id="confidence" style="color:#fff;">0%</b></div>

        <div class="bar-container">
            <div id="buy-bar" class="buy-bar" style="width: 50%;"></div>
            <div id="sell-bar" class="sell-bar" style="width: 50%;"></div>
        </div>

        <div class="stats">
            <span>Buyer Vol: <b id="total-bids" style="color:#0ecb81">0</b></span>
            <span>Imbalance: <b id="imbalance-val" style="color:#fff">0.000</b></span>
            <span>Seller Vol: <b id="total-asks" style="color:#f6465d">0</b></span>
        </div>
    </div>

    <!-- LIVE DATA BOOK IMPORT DISPLAY -->
    <div class="book-container">
        <div class="book-title">▼ LIVE ORDER BOOK IMPORT STREAM ▼</div>
        <div class="book-grid">
            <div>
                <div class="book-col-header"><span>BID PRICE</span><span>QTY</span></div>
                <div id="bids-stream"></div>
            </div>
            <div>
                <div class="book-col-header"><span>ASK PRICE</span><span>QTY</span></div>
                <div id="asks-stream"></div>
            </div>
        </div>
    </div>
</div>

<!-- EXTERNAL MODULE MODULAR SCRIPTS -->
<script src="stream.js"></script>
<script src="calculator.js"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentAsset = urlParams.get('asset') || 'BTCUSDT';
    
    document.getElementById('asset-selector').value = currentAsset;

    function switchAssetWithReload() {
        const selected = document.getElementById('asset-selector').value;
        window.location.href = window.location.pathname + '?asset=' + selected;
    }

        const assetRegistry = {
        'BTCUSDT': { streamSymbol: 'btcusdt', yahooSymbol: 'BTC-USD', decimals: 2, isForex: false },
        'ETHUSDT': { streamSymbol: 'ethusdt', yahooSymbol: 'ETH-USD', decimals: 2, isForex: false },
        'SOLUSDT': { streamSymbol: 'solusdt', yahooSymbol: 'SOL-USD', decimals: 2, isForex: false },
        'CRYPTO_IDX': { streamSymbol: 'btcusdt', yahooSymbol: 'BTC-USD', decimals: 2, isIdx: true, isForex: false },
        'EURUSD': { streamSymbol: 'eurusdt', yahooSymbol: 'EURUSD=X', decimals: 5, isForex: true },
        'AUDCAD': { streamSymbol: 'audusdt', yahooSymbol: 'AUDCAD=X', decimals: 5, isForex: true },
        'AUDCHF': { streamSymbol: 'audusdt', yahooSymbol: 'AUDCHF=X', decimals: 5, isForex: true },
        'AUDJPY': { streamSymbol: 'audusdt', yahooSymbol: 'AUDJPY=X', decimals: 3, isForex: true },
        'AUDUSD': { streamSymbol: 'audusdt', yahooSymbol: 'AUDUSD=X', decimals: 5, isForex: true }
    };


    const config = assetRegistry[currentAsset] || assetRegistry['BTCUSDT'];

    let latestDepthData = null;
    let lockedSignal = null;

    // Stream Instance Setup
    const streamer = new DataStreamer(
        config,
        (livePrice) => {
            document.getElementById('price').innerText = livePrice.toFixed(config.decimals);
            document.getElementById('stream-status').className = 'badge on';
            document.getElementById('stream-status').innerText = 'LIVE EXCHANGE STREAM ACTIVE';
        },
        (depthData) => {
            latestDepthData = depthData;
            renderOrderBookUI(depthData); // Render Real-Time Data Stream at Bottom
        }
    );

    streamer.start();

    // Render Orderbook Stream Table
    function renderOrderBookUI(data) {
        let bidsHtml = '';
        let asksHtml = '';

        data.bids.forEach(b => {
            bidsHtml += `<div class="book-row"><span class="bid-p">${parseFloat(b[0]).toFixed(config.decimals)}</span><span class="vol">${parseFloat(b[1]).toFixed(2)}</span></div>`;
        });

        data.asks.forEach(a => {
            asksHtml += `<div class="book-row"><span class="ask-p">${parseFloat(a[0]).toFixed(config.decimals)}</span><span class="vol">${parseFloat(a[1]).toFixed(2)}</span></div>`;
        });

        document.getElementById('bids-stream').innerHTML = bidsHtml;
        document.getElementById('asks-stream').innerHTML = asksHtml;
    }

    // Binary Clock Engine
    setInterval(() => {
        const seconds = new Date().getSeconds();
        const remainingSeconds = 59 - seconds;

        document.getElementById('timer').innerText = `00:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;

        if (!streamer.isConnected || !latestDepthData) {
            document.getElementById('phase-text').innerText = 'Connecting Exchange Stream...';
            document.getElementById('phase-text').style.color = '#f6465d';
            return;
        }

        // Calculation using calculator.js
        const calculatedResult = SignalCalculator.compute(latestDepthData);

        if (remainingSeconds < 30) {
            lockedSignal = null;
            document.getElementById('phase-text').innerText = 'Accumulating Live Data Book Streams...';
            document.getElementById('phase-text').style.color = '#f0b90b';
            document.getElementById('status-tag').innerText = 'STREAMING DATA BOOK';
            document.getElementById('status-tag').style.background = '#363c4e';
            renderSignalUI(calculatedResult, "ANALYZING...");
        } 
        else if (remainingSeconds >= 45) {
            document.getElementById('phase-text').innerText = 'Confirming First 15s Imbalance Calculation...';
            document.getElementById('phase-text').style.color = '#f0b90b';
            document.getElementById('status-tag').innerText = 'CONFIRMING IMBALANCE';
            document.getElementById('status-tag').style.background = '#f0b90b';
            document.getElementById('status-tag').style.color = '#000';
            renderSignalUI(calculatedResult, "CONFIRMING...");
        } 
        else {
            document.getElementById('phase-text').innerText = 'SIGNAL LOCKED! PLACE BET NOW ON BROKER';
            document.getElementById('phase-text').style.color = '#0ecb81';
            document.getElementById('status-tag').innerText = 'FINAL SIGNAL (BET NOW)';
            document.getElementById('status-tag').style.background = '#0ecb81';
            document.getElementById('status-tag').style.color = '#fff';

            if (!lockedSignal) {
                lockedSignal = calculatedResult;
            }
            renderSignalUI(lockedSignal, lockedSignal.signalText);
        }

        if (seconds === 0) {
            streamer.resetTicks();
        }
    }, 1000);

    function renderSignalUI(calc, overrideText) {
        document.getElementById('signal-card').className = 'signal-card ' + calc.cardClass;

        const sigElem = document.getElementById('signal');
        sigElem.innerText = overrideText === "CONFIRMING..." || overrideText === "ANALYZING..." ? overrideText : calc.signalText;
        sigElem.className = 'signal-type ' + calc.sigClass;

        document.getElementById('confidence').innerText = calc.confidence + '%';
        document.getElementById('imbalance-val').innerText = calc.imbalance.toFixed(3);

        let bidsFormatted = calc.totalBids > 1000000 ? (calc.totalBids/1000000).toFixed(1) + 'M' : Math.round(calc.totalBids / 1000) + 'k';
        let asksFormatted = calc.totalAsks > 1000000 ? (calc.totalAsks/1000000).toFixed(1) + 'M' : Math.round(calc.totalAsks / 1000) + 'k';

        document.getElementById('total-bids').innerText = bidsFormatted;
        document.getElementById('total-asks').innerText = asksFormatted;

        const buyPct = Math.max(10, Math.min(90, ((calc.imbalance + 1) / 2) * 100));
        document.getElementById('buy-bar').style.width = buyPct + '%';
        document.getElementById('sell-bar').style.width = (100 - buyPct) + '%';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBar Multi-Exchange Forex & Crypto Precision System</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #181a20; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .asset-select { width: 100%; padding: 12px; background: #2b313a; color: #fff; border: 1px solid #363c4e; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 15px; outline: none; }
        
        .badges { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .badge.on { background: rgba(14, 203, 129, 0.2); color: #0ecb81; border: 1px solid #0ecb81; }
        .badge.off { background: rgba(246, 70, 93, 0.2); color: #f6465d; border: 1px solid #f6465d; }

        .price { font-size: 28px; font-weight: bold; text-align: center; margin: 5px 0 15px 0; }

        .timer-box { background: #222630; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 15px; }
        .timer-val { font-size: 22px; font-weight: bold; color: #f0b90b; }
        .phase-text { font-size: 12px; margin-top: 4px; font-weight: 600; }

        .signal-card { background: #2b313a; border-radius: 12px; padding: 20px; text-align: center; border: 2px solid transparent; transition: all 0.3s; }
        .signal-card.GREEN { border-color: #0ecb81; background: rgba(14, 203, 129, 0.15); }
        .signal-card.RED { border-color: #f6465d; background: rgba(246, 70, 93, 0.15); }
        
        .signal-type { font-size: 24px; font-weight: 800; margin: 8px 0; }
        .BUY { color: #0ecb81; }
        .SELL { color: #f6465d; }
        .WAITING { color: #848e9c; }

        .status-tag { font-size: 11px; padding: 4px 10px; border-radius: 4px; display: inline-block; font-weight: bold; text-transform: uppercase; }
        
        .bar-container { background: #363c4e; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; display: flex; }
        .buy-bar { background: #0ecb81; height: 100%; width: 50%; transition: width 0.2s; }
        .sell-bar { background: #f6465d; height: 100%; width: 50%; transition: width 0.2s; }

        .stats { display: flex; justify-content: space-between; font-size: 11px; color: #848e9c; }
        .stats b { font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <select id="asset-selector" class="asset-select" onchange="changeAsset()">
        <optgroup label="Crypto Assets">
            <option value="BTCUSDT">Bitcoin (BTC/USDT)</option>
            <option value="ETHUSDT">Ethereum (ETH/USDT)</option>
            <option value="SOLUSDT">Solana (SOL/USDT)</option>
            <option value="CRYPTO_IDX">Crypto IDX</option>
        </optgroup>
        <optgroup label="Forex Pairs (Merged Binance + Yahoo Feed)">
            <option value="EURUSD">EUR / USD</option>
            <option value="AUDCAD">AUD / CAD</option>
            <option value="AUDCHF">AUD / CHF</option>
            <option value="AUDJPY">AUD / JPY</option>
            <option value="AUDUSD">AUD / USD</option>
        </optgroup>
    </select>

    <div class="badges">
        <span id="binance-status" class="badge off">Binance OFF</span>
        <span id="yahoo-status" class="badge off">Yahoo FX OFF</span>
    </div>

    <div id="price" class="price">0.00000</div>

    <div class="timer-box">
        <div>Clock: <span id="timer" class="timer-val">00:59</span></div>
        <div id="phase-text" class="phase-text" style="color:#f0b90b;">System Active...</div>
    </div>

    <div id="signal-card" class="signal-card">
        <div id="status-tag" class="status-tag" style="background:#f0b90b; color:#000;">MERGING ORDERBOOKS</div>
        <div id="signal" class="signal-type WAITING">ANALYZING...</div>
        <div>Confidence: <b id="confidence" style="color:#fff;">50%</b></div>

        <div class="bar-container">
            <div id="buy-bar" class="buy-bar"></div>
            <div id="sell-bar" class="sell-bar"></div>
        </div>

        <div class="stats">
            <span>Buyer Vol: <b id="total-bids" style="color:#0ecb81">0</b></span>
            <span>Imbalance: <b id="imbalance-val" style="color:#fff">0.000</b></span>
            <span>Seller Vol: <b id="total-asks" style="color:#f6465d">0</b></span>
        </div>
    </div>
</div>

<script>
    let currentAsset = 'EURUSD';
    let binanceWs = null, yahooInterval = null;
    
    // Combined Vol Accumulators
    let binanceBids = 0, binanceAsks = 0;
    let yahooBids = 0, yahooAsks = 0;
    let tickCountBuy = 0, tickCountSell = 0;
    
    let lockedSignalData = null;
    let lastYahooPrice = 0;

    // Config Mapping for Asset Precision & Routing
    const assetConfig = {
        'BTCUSDT': { binanceSymbol: 'btcusdt', yahooSymbol: 'BTC-USD', decimals: 2 },
        'ETHUSDT': { binanceSymbol: 'ethusdt', yahooSymbol: 'ETH-USD', decimals: 2 },
        'SOLUSDT': { binanceSymbol: 'solusdt', yahooSymbol: 'SOL-USD', decimals: 2 },
        'CRYPTO_IDX': { binanceSymbol: 'btcusdt', yahooSymbol: 'BTC-USD', decimals: 2 },
        'EURUSD': { binanceSymbol: 'eurusdt', yahooSymbol: 'EURUSD=X', decimals: 5 },
        'AUDCAD': { binanceSymbol: 'audusdt', yahooSymbol: 'AUDCAD=X', decimals: 5 },
        'AUDCHF': { binanceSymbol: 'audusdt', yahooSymbol: 'AUDCHF=X', decimals: 5 },
        'AUDJPY': { binanceSymbol: 'audusdt', yahooSymbol: 'AUDJPY=X', decimals: 3 },
        'AUDUSD': { binanceSymbol: 'audusdt', yahooSymbol: 'AUDUSD=X', decimals: 5 }
    };

    function initDataStreams() {
        if (binanceWs) binanceWs.close();
        if (yahooInterval) clearInterval(yahooInterval);

        resetAccumulators();
        document.getElementById('price').innerText = "CONNECTING...";

        document.getElementById('binance-status').className = 'badge off';
        document.getElementById('binance-status').innerText = 'Binance OFF';
        document.getElementById('yahoo-status').className = 'badge off';
        document.getElementById('yahoo-status').innerText = 'Yahoo FX OFF';

        const config = assetConfig[currentAsset] || assetConfig['EURUSD'];

        // 1. Binance Depth & Trade Stream
        binanceWs = new WebSocket(`wss://stream.binance.com:9443/ws/${config.binanceSymbol}@depth10@100ms/${config.binanceSymbol}@trade`);

        binanceWs.onopen = () => {
            document.getElementById('binance-status').className = 'badge on';
            document.getElementById('binance-status').innerText = 'Binance ON';
        };

        binanceWs.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.p && !currentAsset.includes('USD=X')) {
                // If pure crypto or crypto-correlated
                if(currentAsset === 'CRYPTO_IDX') {
                    let idxPrice = parseFloat(data.p) * 0.125 + 250;
                    document.getElementById('price').innerText = idxPrice.toFixed(config.decimals);
                } else if(!currentAsset.includes('EUR') && !currentAsset.includes('AUD')) {
                    document.getElementById('price').innerText = parseFloat(data.p).toFixed(config.decimals);
                }

                if (data.m) {
                    tickCountSell += parseFloat(data.q);
                } else {
                    tickCountBuy += parseFloat(data.q);
                }
            }

            if (data.bids && data.asks) {
                binanceBids = data.bids.reduce((sum, item) => sum + (parseFloat(item[0]) * parseFloat(item[1])), 0);
                binanceAsks = data.asks.reduce((sum, item) => sum + (parseFloat(item[0]) * parseFloat(item[1])), 0);
            }
        };

        // 2. Yahoo Finance Live Interbank Rate & Tick Imbalance Fetcher
        fetchYahooData(config);
        yahooInterval = setInterval(() => fetchYahooData(config), 2000); // 2 second sync
    }

    async function fetchYahooData(config) {
        try {
            const symbol = config.yahooSymbol;
            const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m`);
            const json = await res.json();

            if (json.chart && json.chart.result && json.chart.result[0]) {
                const meta = json.chart.result[0].meta;
                const currentPrice = meta.regularMarketPrice;

                document.getElementById('yahoo-status').className = 'badge on';
                document.getElementById('yahoo-status').innerText = 'Yahoo FX ON';

                // Update Forex Price from Interbank Feed
                if(currentAsset.includes('EUR') || currentAsset.includes('AUD')) {
                    document.getElementById('price').innerText = currentPrice.toFixed(config.decimals);
                }

                // Calculate Yahoo Tick Vol Weight
                if (lastYahooPrice !== 0) {
                    const priceDiff = currentPrice - lastYahooPrice;
                    if (priceDiff > 0) {
                        yahooBids += Math.abs(priceDiff) * 100000; // Buyer Pressure
                    } else if (priceDiff < 0) {
                        yahooAsks += Math.abs(priceDiff) * 100000; // Seller Pressure
                    }
                }
                lastYahooPrice = currentPrice;
            }
        } catch (e) {
            console.log("Yahoo Fetch Fallback Sync active...");
        }
    }

    function changeAsset() {
        currentAsset = document.getElementById('asset-selector').value;
        lockedSignalData = null;
        initDataStreams();
    }

    function resetAccumulators() {
        binanceBids = 0; binanceAsks = 0;
        yahooBids = 0; yahooAsks = 0;
        tickCountBuy = 0; tickCountSell = 0;
        lastYahooPrice = 0;
    }

    // Binary Timer Sync Engine (30s Bet / 15s Confirmation / 15s Bet Window)
    setInterval(() => {
        const now = new Date();
        const seconds = now.getSeconds();
        const remainingSeconds = 59 - seconds;

        document.getElementById('timer').innerText = `00:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;

        // PHASE 1: 30s to 00s (Background Merged Orderbook Calculation)
        if (remainingSeconds < 30) {
            lockedSignalData = null;
            document.getElementById('phase-text').innerText = 'Bet Paused. Accumulating Merged Binance + Yahoo Feed...';
            document.getElementById('phase-text').style.color = '#f0b90b';
            
            document.getElementById('status-tag').innerText = 'BACKGROUND ACCUMULATION';
            document.getElementById('status-tag').style.background = '#363c4e';
            document.getElementById('status-tag').style.color = '#fff';

            const liveData = calculateMergedData();
            renderUI(liveData, "ANALYZING...");
        } 
        // PHASE 2: 59s to 45s (First 15s Confirmation Window)
        else if (remainingSeconds >= 45) {
            document.getElementById('phase-text').innerText = 'New Candle Open! Merging First 15s FX Imbalance...';
            document.getElementById('phase-text').style.color = '#f0b90b';
            
            document.getElementById('status-tag').innerText = 'CONFIRMING IMBALANCE (15s)';
            document.getElementById('status-tag').style.background = '#f0b90b';
            document.getElementById('status-tag').style.color = '#000';

            const liveData = calculateMergedData();
            renderUI(liveData, "CONFIRMING...");
        } 
        // PHASE 3: 44s to 30s (Signal Locked / Bet Window Open)
        else {
            document.getElementById('phase-text').innerText = 'MERGED SIGNAL LOCKED! PLACE BET NOW ON BROKER';
            document.getElementById('phase-text').style.color = '#0ecb81';
            
            document.getElementById('status-tag').innerText = 'FINAL SIGNAL (BET NOW)';
            document.getElementById('status-tag').style.background = '#0ecb81';
            document.getElementById('status-tag').style.color = '#fff';

            if (!lockedSignalData) {
                lockedSignalData = calculateMergedData();
            }
            renderUI(lockedSignalData, lockedSignalData.signalText);
        }

        if (seconds === 0) {
            resetAccumulators();
        }
    }, 1000);

    function calculateMergedData() {
        // Combined Formula: Binance Volume + Yahoo FX Tick Imbalance Weight
        const totalBids = binanceBids + yahooBids + (tickCountBuy * 500);
        const totalAsks = binanceAsks + yahooAsks + (tickCountSell * 500);
        const totalVolume = totalBids + totalAsks;

        if (totalVolume === 0) {
            return { signalText: "LEAN NEUTRAL", sigClass: "WAITING", cardClass: "", confidence: 50, imbalance: 0, totalBids: 0, totalAsks: 0 };
        }

        const imbalance = (totalBids - totalAsks) / totalVolume;
        const confidence = Math.min(Math.round(52 + (Math.abs(imbalance) * 48)), 99);

        let signalText = "LEAN NEUTRAL";
        let cardClass = "";
        let sigClass = "WAITING";

        if (imbalance > 0.04) {
            signalText = "NEXT CANDLE: GREEN (BUY)";
            sigClass = "BUY";
            cardClass = "GREEN";
        } else if (imbalance < -0.04) {
            signalText = "NEXT CANDLE: RED (SELL)";
            sigClass = "SELL";
            cardClass = "RED";
        }

        return { signalText, sigClass, cardClass, confidence, imbalance, totalBids, totalAsks };
    }

    function renderUI(data, overrideText) {
        const sigCard = document.getElementById('signal-card');
        sigCard.className = 'signal-card ' + data.cardClass;

        const sigElem = document.getElementById('signal');
        sigElem.innerText = overrideText === "CONFIRMING..." || overrideText === "ANALYZING..." ? overrideText : data.signalText;
        sigElem.className = 'signal-type ' + data.sigClass;

        document.getElementById('confidence').innerText = data.confidence + '%';
        document.getElementById('imbalance-val').innerText = data.imbalance.toFixed(3);

        let bidsFormatted = data.totalBids > 1000000 ? (data.totalBids/1000000).toFixed(1) + 'M' : Math.round(data.totalBids / 1000) + 'k';
        let asksFormatted = data.totalAsks > 1000000 ? (data.totalAsks/1000000).toFixed(1) + 'M' : Math.round(data.totalAsks / 1000) + 'k';

        document.getElementById('total-bids').innerText = bidsFormatted;
        document.getElementById('total-asks').innerText = asksFormatted;

        const buyPct = Math.max(10, Math.min(90, ((data.imbalance + 1) / 2) * 100));
        document.getElementById('buy-bar').style.width = buyPct + '%';
        document.getElementById('sell-bar').style.width = (100 - buyPct) + '%';
    }

    initDataStreams();
</script>
</body>
</html>
